[package]
name = "desk"
version = "0.1.0"
description = "inkling writing desk"
authors = ["Josh Gretz"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows. See rust-lang/cargo#8519.
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Under `tauri dev` the app runs unbundled, so macOS has no Info.plist to read
# CFBundleName from and labels the Dock with the executable filename. Without
# this it inherits the package name and reads "desk".
[[bin]]
name = "Inkling"
path = "src/main.rs"

[build-dependencies]
tauri-build = {version = "2", features = [] }

[dependencies]
tauri = {version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = {version = "1", features = ["derive"] }
serde_json = "1"
